# AR017: blockwise MTP draft-verify decoding on 7B-scale block semi-AR
# denoising generation (LLaDA/Dream-style: prompt + multi-block answer
# generation; round-0 all-position parallel draft + self-consistency
# verify iterations to a fixpoint, Fast-dLLM MTP / Jacobi-style).
#
# Model dimensions (configs/experiments/model_7b_longctx.yaml):
#   num_layers=32  num_heads=32  head_dim=128  hidden_dim=4096
#   intermediate_dim=11008  vocab_size=32000  max_seq_len=8192
#
# model_weights: RESERVED for AR018 (real pretrained dLLM weight loader
# adapter). Until AR018 lands, runs use randomly initialized weights at
# 7B dimensions; with random weights the registered CPU evidence predicts
# draft-verify == mask-init PARITY (no stable argmax fixpoint under random
# weights; see bench-results.md section 1/3.5), so the server-venue
# assertions below are ONLY judgable on real pretrained weights.
model_weights: null
#
# Arms (one run per seed 0/1/2, 3 repeats each; run via
# PyTorchModelBackend.generate / blockwise_generate_baseline with
# --mode {mask-init,draft-verify}, see
# specs/archive/AR017-mtp-draft-verify-decoding/server-experiment.md):
#   0) baseline (mask-init):     blockwise_generate_baseline, full
#                                recompute per round (AR016 golden)
#   1) baseline-dv:              blockwise_generate_baseline with
#                                draft_mode=True (decision-equivalent
#                                reference; exactness anchor)
#   2) mask-init:                generate, page_precision=fp32
#                                (AR016 pipeline, comparison arm)
#   3) draft-verify:             generate, draft_mode=True, fp32 pages
#                                (this AR, measured arm)
#
# Server-venue assertions (real pretrained weights only; random-weight
# runs are expected to show parity, report-only):
#   S1: draft-verify vs mask-init end-to-end >= 1.5x
#   S2: draft-verify vs mask-init per-block round reduction >= 2x
#       (rounds_per_block / rounds_to_fixpoint distributions)
#   S3: draft-verify vs mask-init token agreement >= 0.90
#   S4 (exactness anchor, weights-independent): draft-verify paged tokens
#       bitwise equal baseline-dv + schedule tables equal (CPU evidence:
#       9/9 points; A1/A2 in bench-results.md section 3)
#
# Record end-to-end time, per-block time (stats block_time_ms), total
# rounds, rounds_to_fixpoint distribution, changed_per_round trajectories,
# draft_acceptance_rate, computed_rows_total, kv_write_rows_total
# (== P+G expected). CPU-side evidence and honesty notes:
#   specs/archive/AR017-mtp-draft-verify-decoding/bench-results.md
# (CPU random-weight toy: draft-verify == mask-init parity, median ratio
# 0.997-1.039x; two-arm bitwise + schedule equality 9/9; acceptance
# 0.042-0.065 as bad-draft rejection evidence.)
# Full protocol:
#   specs/archive/AR017-mtp-draft-verify-decoding/server-experiment.md
#
# Usage (see server-experiment.md section 4 for the full four-arm runner):
#   python specs/archive/AR017-mtp-draft-verify-decoding/serve_arm.py \
#     --config configs/experiments/s12_draft_verify_gpu.yaml \
#     --model-config configs/experiments/model_7b_longctx.yaml \
#     --arm fp32 --mode draft-verify --seed 0 \
#     --out results/ar017_s12_dv_fp32
log_level: ERROR
warmup_steps: 1
latency_budget_ms: 3000.0
memory_budget_mb: 4096.0

execution:
  # Draft-verify protocol (AR017). confidence_threshold only affects the
  # mask-init comparison arm (draft-verify is threshold-free); keep 0.9
  # as the real-dLLM protocol default (s11 calibration note). draft_mode
  # is overridden by serve_arm.py --mode; the registered main comparison
  # is --mode draft-verify vs --mode mask-init at page_precision=fp32.
  block_decoding_enabled: true
  block_size: 32
  confidence_threshold: 0.9
  max_rounds: 8
  mask_token_id: 0
  draft_mode: false
  kv_lifecycle: replace
  kv_execution: paged
  page_size: 32
  page_precision: fp32
  packed_precision: fp16
  int4_group_size: 16
  prompt_len: 256
  gen_len: 512

shadowkv:
  enabled: true
  use_packed_cache: true
  store_dense_kv: false
  int4_group_size: 16
  dense_precision_enabled: true
  rd_allocation_enabled: true
  hard_eviction_enabled: false
  compression_ratio: 0.2
  irap_decay: 0.85
  entropy_weight: 0.4
  sink_tokens: 8
  eviction_pressure_threshold: 0.8
  memory_budget_mb: 4096
  precision_levels: ["fp32", "fp16", "int8", "int4"]
  reuse:
    enabled: false

qdrift:
  enabled: true
  noise_schedule: cosine
  sensitivity_temperature: 1.2
  drift_method: relative_l2
  positional_prior_weight: 0.3
  use_importance_drift: true
  importance_drift_weight: 0.3

ffn:
  enabled: true
  mixed_precision: true
  channel_importance_threshold: 0.7
  sparse_update: true
  delta_threshold: 0.05

profiler:
  accuracy_warning: 0.03
  accuracy_critical: 0.05
  latency_warning_ratio: 1.5
  memory_warning_ratio: 0.9

constraints:
  # Weights-independent gate: the draft-verify paged arm must stay
  # bitwise-exact vs the baseline-dv recompute arm on equal trajectories
  # (CPU evidence: 9/9). Performance/quality gates S1-S3 are
  # server-venue assertions judgable on real pretrained weights (AR018);
  # random-weight runs report parity honestly, never as failure.
  max_accuracy_drop: 0.01
  max_latency_ms: 3000
  max_memory_mb: 4096
