# AR013: step-reuse + packed KV execution on 7B-scale diffusion transformer.
#
# Model dimensions (configs/experiments/model_7b_longctx.yaml):
#   num_layers=32  num_heads=32  head_dim=128  hidden_dim=4096
#   intermediate_dim=11008  vocab_size=32000  max_seq_len=8192
#
# Baseline: same command with execution.kv_lifecycle=replace and all toggles false
# (kv_execution=dense, step_reuse_enabled=false). One run per seed (0/1/2),
# 3 repeats each; record per-step latency median[min-max], peak VRAM,
# execution_stats.resident_bytes / data_plane_bytes / dense_bytes, and logits
# relL2 vs baseline. Full protocol:
#   specs/archive/AR013-step-reuse-packed-execution/server-experiment.md
#
# Usage:
#   python scripts/run_experiment.py \
#     --config configs/experiments/s8_step_reuse_gpu.yaml \
#     --model-config configs/experiments/model_7b_longctx.yaml \
#     --backend pytorch --device cuda --steps 30 --repeats 3 --seed 0 \
#     --out results/ar013_s8
log_level: ERROR
warmup_steps: 2
latency_budget_ms: 300.0
memory_budget_mb: 4096.0

execution:
  kv_lifecycle: replace
  kv_execution: packed
  packed_precision: fp16
  step_reuse_enabled: true
  step_reuse_threshold: 0.1
  step_reuse_warmup_steps: 1
  int4_group_size: 16

shadowkv:
  enabled: true
  use_packed_cache: true
  store_dense_kv: false
  int4_group_size: 16
  dense_precision_enabled: true
  rd_allocation_enabled: true
  hard_eviction_enabled: false
  compression_ratio: 0.2
  irap_decay: 0.85
  entropy_weight: 0.4
  sink_tokens: 8
  eviction_pressure_threshold: 0.8
  memory_budget_mb: 4096
  precision_levels: ["fp32", "fp16", "int8", "int4"]
  reuse:
    enabled: true
    base_threshold: 0.12
    adaptive: true

qdrift:
  enabled: true
  noise_schedule: cosine
  sensitivity_temperature: 1.2
  drift_method: relative_l2
  positional_prior_weight: 0.3
  use_importance_drift: true
  importance_drift_weight: 0.3

ffn:
  enabled: true
  mixed_precision: true
  channel_importance_threshold: 0.7
  sparse_update: true
  delta_threshold: 0.05

profiler:
  accuracy_warning: 0.005
  accuracy_critical: 0.01
  latency_warning_ratio: 1.5
  memory_warning_ratio: 0.9

constraints:
  max_accuracy_drop: 0.02
  max_latency_ms: 300
  max_memory_mb: 4096
