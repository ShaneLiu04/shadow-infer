# AR014: paged incremental KV residency on 7B-scale long-context append serving.
#
# Model dimensions (configs/experiments/model_7b_longctx.yaml):
#   num_layers=32  num_heads=32  head_dim=128  hidden_dim=4096
#   intermediate_dim=11008  vocab_size=32000  max_seq_len=8192
#
# Baseline arm: same command with execution.kv_execution=packed
# (append lifecycle, full unpack+repack per step). One run per seed (0/1/2),
# 3 repeats each; record per-step latency median[min-max] (expect near-flat
# growth for paged vs linear for packed), peak VRAM, execution_stats keys
# (page_count / appended_tokens_total / repack_tokens_saved /
# resident_bytes / data_plane_bytes / dense_bytes), and logits relL2 vs
# baseline (fp16 arm must be exactly equal). CPU-side KV-plane evidence:
#   specs/archive/AR014-paged-kv-store/bench-results.md (9.3x-10.2x median)
# Full protocol:
#   specs/archive/AR014-paged-kv-store/server-experiment.md
#
# Usage:
#   python scripts/run_experiment.py \
#     --config configs/experiments/s9_paged_longctx_gpu.yaml \
#     --model-config configs/experiments/model_7b_longctx.yaml \
#     --backend pytorch --device cuda --steps 30 --repeats 3 --seed 0 \
#     --out results/ar014_s9
log_level: ERROR
warmup_steps: 2
latency_budget_ms: 300.0
memory_budget_mb: 4096.0

execution:
  kv_lifecycle: append
  kv_execution: paged
  page_size: 32
  packed_precision: fp16
  int4_group_size: 16

shadowkv:
  enabled: true
  use_packed_cache: true
  store_dense_kv: false
  int4_group_size: 16
  dense_precision_enabled: true
  rd_allocation_enabled: true
  hard_eviction_enabled: false
  compression_ratio: 0.2
  irap_decay: 0.85
  entropy_weight: 0.4
  sink_tokens: 8
  eviction_pressure_threshold: 0.8
  memory_budget_mb: 4096
  precision_levels: ["fp32", "fp16", "int8", "int4"]
  reuse:
    enabled: false

qdrift:
  enabled: true
  noise_schedule: cosine
  sensitivity_temperature: 1.2
  drift_method: relative_l2
  positional_prior_weight: 0.3
  use_importance_drift: true
  importance_drift_weight: 0.3

ffn:
  enabled: true
  mixed_precision: true
  channel_importance_threshold: 0.7
  sparse_update: true
  delta_threshold: 0.05

profiler:
  accuracy_warning: 0.005
  accuracy_critical: 0.01
  latency_warning_ratio: 1.5
  memory_warning_ratio: 0.9

constraints:
  max_accuracy_drop: 0.02
  max_latency_ms: 300
  max_memory_mb: 4096
