# AR007 profile s3: long-context (8K) stress point with a tight 4GB budget.
# Usage:
#   python scripts/run_experiment.py --config configs/experiments/s3_longctx_gpu.yaml \
#     --model-config configs/model_fast_dllm_7b.yaml \
#     --backend hf --model-name <hf-model-id> --device cuda --steps 24 --repeats 3
log_level: ERROR
warmup_steps: 3
latency_budget_ms: 300.0
memory_budget_mb: 4096.0

shadowkv:
  enabled: true
  use_packed_cache: true
  compression_ratio: 0.35
  irap_decay: 0.85
  entropy_weight: 0.4
  sink_tokens: 8
  eviction_pressure_threshold: 0.8
  memory_budget_mb: 4096
  precision_levels: ["fp32", "fp16", "int8", "int4"]
  importance_thresholds:
    fp32: 0.75
    fp16: 0.45
    int8: 0.15
    int4: 0.0
  reuse:
    enabled: true
    base_threshold: 0.12
    adaptive: true

qdrift:
  enabled: true
  noise_schedule: cosine
  sensitivity_temperature: 1.2
  drift_method: relative_l2
  positional_prior_weight: 0.3
  use_importance_drift: true
  importance_drift_weight: 0.3
  dispatch_matrix:
    low_sensitivity_low_drift: aggressive_sparse
    low_sensitivity_high_drift: balanced_sparse
    mid_sensitivity_low_drift: balanced_mixed
    mid_sensitivity_high_drift: conservative_mixed
    high_sensitivity: conservative_full

ffn:
  enabled: true
  mixed_precision: true
  channel_importance_threshold: 0.7
  sparse_update: true
  delta_threshold: 0.05
  compute_paths: ["reuse", "incremental", "sparse", "full"]

profiler:
  accuracy_warning: 0.005
  accuracy_critical: 0.01
  latency_warning_ratio: 1.5
  memory_warning_ratio: 0.9

constraints:
  max_accuracy_drop: 0.01
  max_latency_ms: 300
  max_memory_mb: 4096
