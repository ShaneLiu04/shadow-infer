# optimize_full.yaml
# 全局优化配置模板
# 对应 TECHNICAL_SPEC.md §4.2 优化配置

optimization:
  enabled: true

shadowkv:
  enabled: true
  compression_ratio: 0.5
  # v3.5.0 IRAP / 预算准入（agent 扁平键映射）
  # attention 契约默认随后端自动接线（真实后端=probabilities / mock=logits）；
  # 仅在实验需要强制覆盖时显式设置 attn_is_probabilities（true/false）
  irap_decay: 0.9                    # 跨步 EMA 衰减 gamma ∈ (0,1)
  entropy_weight: 0.3                # 行熵辅助权重 beta ∈ [0,1]
  sink_tokens: 4                     # 前缀 sink 硬保护 token 数
  eviction_pressure_threshold: 0.9   # memory_pressure 触发阈值 ∈ (0,1]
  memory_budget_mb: 6144             # 端侧 6GB 预算（不设则不做预算动作）
  precision_levels:
    - "fp32"
    - "fp16"
    - "int8"
    - "int4"
  importance_thresholds:
    fp32: 0.8
    fp16: 0.5
    int8: 0.2
    int4: 0.0
  reuse:
    enabled: true
    base_threshold: 0.15
    adaptive: true

qdrift:
  enabled: true
  noise_schedule: "cosine"
  sensitivity_temperature: 1.0
  drift_method: "relative_l2"
  positional_prior_weight: 0.3
  # v3.5.0：IRAP ΔA 可选融合（默认关闭，保持既有语义）
  use_importance_drift: false
  importance_drift_weight: 0.3
  dispatch_matrix:
    low_sensitivity_low_drift: "aggressive_sparse"
    low_sensitivity_high_drift: "balanced_sparse"
    mid_sensitivity_low_drift: "balanced_mixed"
    mid_sensitivity_high_drift: "conservative_mixed"
    high_sensitivity: "conservative_full"

ffn:
  enabled: true
  mixed_precision: true
  channel_importance_threshold: 0.7
  sparse_update: true
  delta_threshold: 0.05
  compute_paths:
    - "reuse"
    - "incremental"
    - "sparse"
    - "full"

constraints:
  max_accuracy_drop: 0.01
  max_latency_ms: 100
  max_memory_mb: 8192
